[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-bot"
version = "1.0.0"
description = "Autonomous Alpaca stock day-trading bot with survival-mode risk adaptation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.40.0",
  "pydantic-settings>=2.0.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "apscheduler>=3.10.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
alpaca-bot = "alpaca_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
